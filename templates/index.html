<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Расчитать</button>
    </form>
    <ul>
        {% for m in calculations %}
            <li>{{ m.math1 }} + {{ m.math2 }} = {{ m.result }}</li>
        {% endfor %}
    </ul>
</body>
</html>
